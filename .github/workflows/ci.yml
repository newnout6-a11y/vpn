# CI of the Rust client. Windows runners: the product is Win32 code, so Linux would prove nothing about it.
# GitHub-hosted Windows runners run jobs elevated, which makes CI the only place where the privileged parts
# (WFP filters, TUN, scheduled tasks, legacy cleanup) and the installer run without a human: the `elevated`
# and `package` jobs are the product's main proof for those parts.
# Runs on pull_request and push to main (never on comments), without secrets, with read-only permissions.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Same toolchain as `rust-version` in the workspace Cargo.toml; bump both together.
  RUST_TOOLCHAIN: '1.99.1'

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: vpn-tunnel-enforcer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token is not needed after checkout and must not stay in .git/config
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ hashFiles('vpn-tunnel-enforcer/Cargo.lock', 'vpn-tunnel-enforcer/xtask/Cargo.lock') }}
          restore-keys: cargo-registry-
      # Archives are re-verified against the pins after every restore, so the cache cannot inject bytes.
      - name: Pinned download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vpn-tunnel-enforcer/target/download-cache
          key: pinned-downloads-${{ hashFiles('vpn-tunnel-enforcer/resources/engines.toml') }}
      - name: rustfmt
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path xtask/Cargo.toml --check
      # Engine-check tests skip quietly without the binaries; `verify` turns a missing file into a failure.
      - name: Pinned engines (SHA-256 of every archive and file)
        run: |
          cargo xtask engines
          cargo xtask verify
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path xtask/Cargo.toml --target-dir target/xtask --all-targets --locked -- -D warnings
      - name: Tests
        run: |
          cargo test --workspace --locked
          cargo test --manifest-path xtask/Cargo.toml --target-dir target/xtask --locked

  docs:
    name: Acceptance traceability (docs)
    # Pure Python over docs/ (AGENTS.md Definition of Done: exit 0); no Win32 needed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token is not needed after checkout and must not stay in .git/config
      - name: check-coverage.py
        run: python3 docs/04-приёмочные-тесты/traceability/check-coverage.py

  elevated:
    name: Privileged tests (elevated runner)
    needs: rust
    # A fresh machine: these tests create and remove real WFP objects, adapters and tasks.
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: vpn-tunnel-enforcer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token is not needed after checkout and must not stay in .git/config
      - name: Runner must be elevated
        shell: pwsh
        run: |
          $principal = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The privileged tests need an elevated runner; they would prove nothing here.'
          }
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ hashFiles('vpn-tunnel-enforcer/Cargo.lock', 'vpn-tunnel-enforcer/xtask/Cargo.lock') }}
          restore-keys: cargo-registry-
      - name: Pinned download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vpn-tunnel-enforcer/target/download-cache
          key: pinned-downloads-${{ hashFiles('vpn-tunnel-enforcer/resources/engines.toml') }}
      - name: Pinned engines
        run: |
          cargo xtask engines
          cargo xtask verify
      # Tests marked #[ignore = "needs elevation"] (and any other ignored test); one at a time because they
      # share machine-wide state (WFP provider, TUN adapter, task folder).
      # A finished crate the rest of the workspace does not depend on yet: prove its privileged code early.
      - name: winnet: unprivileged tests
        run: cargo test -p vpnte-winnet
      - name: winnet: real WFP objects and the autostart task
        run: cargo test -p vpnte-winnet -- --ignored elevated_ --test-threads=1 --nocapture
      - name: Tests that need elevation
        run: cargo test --workspace --locked -- --ignored --test-threads=1

  package:
    name: Installer (build, silent install, upgrade, uninstall)
    needs: rust
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: vpn-tunnel-enforcer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token is not needed after checkout and must not stay in .git/config
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ hashFiles('vpn-tunnel-enforcer/Cargo.lock', 'vpn-tunnel-enforcer/xtask/Cargo.lock') }}
          restore-keys: cargo-registry-
      - name: Pinned download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vpn-tunnel-enforcer/target/download-cache
          key: pinned-downloads-${{ hashFiles('vpn-tunnel-enforcer/resources/engines.toml') }}
      - name: NSIS (pinned)
        run: cargo xtask nsis
      - name: Build the installer
        run: cargo xtask dist
      # GitHub sets CI=true; smoke-install refuses to run anywhere else.
      - name: Silent install, upgrade over itself, uninstall
        run: cargo xtask smoke-install
      # The repository is public: only the installer and its checksums, never logs or user data.
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vpnte-installer-${{ github.sha }}
          path: |
            vpn-tunnel-enforcer/target/dist/VPN-Tunnel-Enforcer-Setup-*.exe
            vpn-tunnel-enforcer/target/dist/VPN-Tunnel-Enforcer-*-portable.zip
            vpn-tunnel-enforcer/target/dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  website:
    name: Сайт (сборка и HTML)
    # Сборщик и линтер — чистый Node без зависимостей и без Win32: хватает Linux-раннера.
    # Проверки в браузере (tools/check.mjs, fontcheck.mjs) требуют Chrome и сюда не входят.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # токен не нужен после загрузки кода и не должен остаться в .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Сборка
        run: node tools/build.mjs
      - name: Тесты таймеров
        run: node --test
      - name: Баланс тегов и ссылки
        run: node tools/lint-html.mjs
