# Автоматическая проверка на Windows: приложение зависит от Win32, PowerShell и Electron, поэтому на Linux
# эти проверки ничего не доказывают. Запускается только на pull_request и push в main (не от комментариев),
# без секретов и с правами только на чтение.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  app:
    name: Приложение (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: vpn-tunnel-enforcer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vpn-tunnel-enforcer/package-lock.json
      # В lockfile два пакета (fast-uri, js-yaml) записаны как git+ssh://git@github.com/...; у раннера нет SSH-ключа.
      - name: Читать GitHub-зависимости по https
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit-тесты
        run: npm test
      - name: Трассировка приёмочных тестов
        working-directory: .
        run: python docs/04-приёмочные-тесты/traceability/check-coverage.py
      # Нативные чтения запускаются под настоящим Electron: фатальная ошибка koffi под Electron не видна из Node.
      - name: Нативные чтения под Electron
        run: npm run test:electron-probe

  sidecar:
    name: ETW-сайдкар (Rust)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo test
        shell: bash
        run: cargo test --locked --manifest-path vpn-tunnel-enforcer/native/vpnte-etw-sidecar/Cargo.toml
