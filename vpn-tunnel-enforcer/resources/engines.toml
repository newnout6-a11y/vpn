# The one pin manifest for everything third-party or repo-tracked that ships, and for the build tools.
# `cargo xtask engines` downloads each archive, checks its SHA-256, extracts the listed files (each also checked)
# and fills the development drop resources/ with the members installed under `resources/`; `cargo xtask dist`
# stages every entry at its `install` path (relative to the installation directory) for packaging.
# Hash rules: archives and members = raw bytes; [[local]] with `text = true` = the text with LF line endings
# (staged with CRLF), so the pin does not depend on git's core.autocrlf.
schema = 2

[[archive]]
id = "sing-box"
version = "1.14.4"
