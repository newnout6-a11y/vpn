[package]
name = "vpnte-cleanup"
description = "One-shot removal of what the old Electron app left in the system: firewall rules, legacy WFP objects, scheduled tasks, adapter leftovers, orphaned runtime processes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vpnte-base.workspace = true
vpnte-core.workspace = true
vpnte-winnet.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
parking_lot.workspace = true
windows.workspace = true
ipnet.workspace = true

[features]
# Build scaffolding: one flag per work package while they are written in parallel.
default = ["cleanup-legacy"]
cleanup-legacy = []

[lints]
workspace = true
