[package]
name = "vpnte-cleanup"
description = "One-shot removal of what the old Electron app left in the system: firewall rules, legacy WFP objects, scheduled tasks, adapter leftovers, orphaned runtime processes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
vpnte-base.workspace = true
vpnte-core.workspace = true
vpnte-winnet.workspace = true
windows.workspace = true
# `#[interface]` declarations of the INetCfg family, absent from the `windows` 0.62 metadata
# (same windows-core version the `windows` crate already builds).
windows-core = "0.62"

[features]
# Build scaffolding: one flag per work package while they are written in parallel.
default = ["cleanup-legacy"]
cleanup-legacy = []

[lints]
workspace = true
