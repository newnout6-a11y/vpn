[package]
name = "vpnte-engine"
description = "sing-box and Xray: config generation, process supervision, Clash API, routing and DNS rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
parking_lot.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["serde"] }
vpnte-base.workspace = true
vpnte-core.workspace = true
vpnte-profiles.workspace = true
vpnte-winnet.workspace = true
windows.workspace = true

[features]
# Build scaffolding: one flag per work package while they are written in parallel.
default = ["engine-config", "engine-process", "engine-xray-config", "engine-routing"]
engine-config = []
engine-process = []
engine-xray-config = []
engine-routing = []

[lints]
workspace = true
