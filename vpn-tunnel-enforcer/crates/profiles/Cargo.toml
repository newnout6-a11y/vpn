[package]
name = "vpnte-profiles"
description = "VPN profiles: the typed model, importers (URI, JSON, Clash, WireGuard, deep links), the sing-box emitter and exporters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
# Bounded subscription-body decompression (gzip / zlib / brotli).
brotli = "9"
flate2 = "1.1"
hex.workspace = true
# NFKD folding of server names for the country guess.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
ipnet = { workspace = true, features = ["serde"] }
percent-encoding.workspace = true
regex.workspace = true
# Streamed YAML events for Clash documents.
saphyr-parser = "0.3.3"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
vpnte-base.workspace = true
# Winsock host name and user name for the legacy subscription HWID.
windows.workspace = true

[lints]
workspace = true
