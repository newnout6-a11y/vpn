[package]
name = "vpnte-profiles"
description = "VPN profiles: the typed model, importers (URI, JSON, Clash, WireGuard, deep links), the sing-box emitter and exporters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vpnte-base.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
percent-encoding.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
regex.workspace = true
uuid.workspace = true
ipnet = { workspace = true, features = ["serde"] }

[features]
# Build scaffolding: one flag per work package while they are written in parallel.
default = ["profiles-emit", "profiles-uri", "profiles-json", "profiles-native", "profiles-text", "profiles-export", "profiles-clash"]
profiles-emit = []
profiles-uri = []
profiles-json = []
profiles-native = []
profiles-text = []
profiles-export = []
profiles-clash = []

[lints]
workspace = true
