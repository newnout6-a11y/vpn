[package]
name = "vpnte-app"
description = "VPN Tunnel Enforcer: the desktop application (bootstrap, wiring of UI and backend)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "vpnte_app"
path = "src/lib.rs"

[[bin]]
name = "vpn-tunnel-enforcer"
path = "src/main.rs"

[dependencies]
vpnte-base.workspace = true
vpnte-core.workspace = true
vpnte-winnet.workspace = true
vpnte-profiles.workspace = true
vpnte-servers.workspace = true
vpnte-engine.workspace = true
vpnte-probes.workspace = true
vpnte-forensics.workspace = true
vpnte-tunnel.workspace = true
vpnte-proxies.workspace = true
vpnte-automation.workspace = true
vpnte-cleanup.workspace = true
vpnte-view.workspace = true
vpnte-ui.workspace = true
anyhow.workspace = true
async-trait.workspace = true
dioxus.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
windows.workspace = true
jiff.workspace = true
uuid.workspace = true
# app-import tests: synthetic Electron `safeStorage` fixtures (v10 = AES-256-GCM, base64).
aes-gcm.workspace = true
base64.workspace = true
# app-tools: the routing self-test's echo client through a Soft session's mixed inbound.
reqwest.workspace = true

[build-dependencies]
embed-resource = "3.0.12"

[features]
# Build scaffolding: one flag per work package while they are written in parallel.
default = ["app-base", "app-dashboard", "app-servers", "app-settings", "app-tunnel", "app-main", "app-import", "app-setup", "app-clickjack", "app-maintenance", "app-tools", "app-lists"]
app-base = []
app-dashboard = ["app-base"]
app-servers = ["app-base"]
app-settings = ["app-base"]
app-tunnel = ["app-base"]
app-main = ["app-base", "app-dashboard", "app-servers", "app-settings", "app-tunnel"]
app-import = ["app-main"]
app-setup = ["app-main"]
# Support helpers (Save dialog, clipboard read) the remaining pages share; needs no other package.
app-clickjack = []
# The Maintenance page (advanced mode) wired to the backend and registered in app-main's root.
app-maintenance = ["app-main", "app-clickjack"]
# The Schedule, Apps (split tunnel) and Traffic history pages wired to the backend and
# registered in app-main's root.
app-lists = ["app-main"]
# The Availability and Speed test pages wired to the backend and registered in app-main's root.
app-tools = ["app-main"]

[lints]
workspace = true
