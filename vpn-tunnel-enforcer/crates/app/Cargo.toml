[package]
name = "vpnte-app"
description = "VPN Tunnel Enforcer: the desktop application (bootstrap, wiring of UI and backend)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "vpnte_app"
path = "src/lib.rs"

[[bin]]
name = "vpn-tunnel-enforcer"
path = "src/main.rs"

[dependencies]
vpnte-base.workspace = true
vpnte-core.workspace = true
vpnte-winnet.workspace = true
vpnte-profiles.workspace = true
vpnte-servers.workspace = true
vpnte-engine.workspace = true
vpnte-probes.workspace = true
vpnte-forensics.workspace = true
vpnte-tunnel.workspace = true
vpnte-proxies.workspace = true
vpnte-automation.workspace = true
vpnte-cleanup.workspace = true
vpnte-view.workspace = true
vpnte-ui.workspace = true
vpnte-service.workspace = true
anyhow.workspace = true
async-trait.workspace = true
dioxus.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
windows.workspace = true
jiff.workspace = true
uuid.workspace = true
# app-import tests: synthetic Electron `safeStorage` fixtures (v10 = AES-256-GCM, base64).
aes-gcm.workspace = true
base64.workspace = true
# app-tools: the routing self-test's echo client through a Soft session's mixed inbound.
reqwest.workspace = true
# fix-autopick: the stall confirmation counts raw bytes below the inner TLS, as the probes do
# (same versions as vpnte-probes: nothing new in the tree).
rustls.workspace = true
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
# w7-phones: QR codes. Export = fast_qr (encoder, modules only); import = rqrr (pure-Rust decoder;
# `img` lets it read a picture type whose copies check a deadline) over pictures decoded by image
# (already in the tree for the tray). Features only add up and dioxus-desktop turns on image's
# default formats, so the QR import picks its five formats itself (`api_servers::qr::FORMATS`).
fast_qr = { version = "0.14.0", default-features = false }
rqrr = { version = "0.11.0", default-features = false, features = ["img"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }

[build-dependencies]
embed-resource = "3.0.12"

[lints]
workspace = true

[features]
# WP-12 lab build (mihomo / AmneziaWG behind the lab record). `cargo xtask dist` builds without it;
# `cargo xtask dist --lab` builds a package marked `-lab`.
lab = [
  "vpnte-base/lab",
  "vpnte-engine/lab",
  "vpnte-tunnel/lab",
  "vpnte-probes/lab",
  "vpnte-ui/lab",
]
