[package]
name = "vpnte-servers"
description = "The user's server list: groups, subscriptions (fetch and refresh), selection, persistence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vpnte-base.workspace = true
vpnte-core = { workspace = true, optional = true }
vpnte-profiles = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
fastrand.workspace = true
futures-util.workspace = true
windows.workspace = true

[features]
# Build scaffolding: one flag per work package while they are written in parallel.
default = ["servers-parse", "servers-store", "servers-refresh"]
servers-parse = ["dep:vpnte-profiles"]
servers-store = ["dep:vpnte-core", "dep:vpnte-profiles"]
servers-refresh = ["servers-store", "servers-parse", "dep:vpnte-core", "dep:vpnte-profiles"]

[lints]
workspace = true
