[package]
name = "vpnte-proxies"
description = "External loopback proxy slots and their local control API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vpnte-base.workspace = true
vpnte-core = { workspace = true, optional = true }
vpnte-winnet = { workspace = true, optional = true }
vpnte-profiles = { workspace = true, optional = true }
vpnte-engine = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
getrandom.workspace = true
hex.workspace = true
futures-util.workspace = true
ipnet.workspace = true
async-trait.workspace = true
jiff.workspace = true
url.workspace = true
windows.workspace = true

[features]
# Build scaffolding: one flag per work package while they are written in parallel.
default = ["proxies-model", "proxies-manager", "proxies-control"]
proxies-model = ["dep:vpnte-core", "dep:vpnte-profiles"]
proxies-manager = ["proxies-model", "dep:vpnte-core", "dep:vpnte-winnet", "dep:vpnte-profiles", "dep:vpnte-engine"]
proxies-control = ["proxies-model", "dep:vpnte-core"]

[[bin]]
name = "vpnte_proxy"
path = "src/bin/vpnte_proxy.rs"
required-features = ["proxies-control"]

[lints]
workspace = true
