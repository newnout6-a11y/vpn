[package]
name = "vpnte-tunnel"
description = "Connection runtime and lifecycle: start, stop, switch, state machine and session history."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vpnte-base.workspace = true
vpnte-core = { workspace = true, optional = true }
vpnte-winnet = { workspace = true, optional = true }
vpnte-profiles = { workspace = true, optional = true }
vpnte-engine = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
parking_lot.workspace = true
futures-util.workspace = true
ipnet.workspace = true
uuid.workspace = true
async-trait.workspace = true
getrandom.workspace = true
hex.workspace = true

[features]
# Build scaffolding: one flag per work package while they are written in parallel.
default = ["tunnel-fsm", "tunnel-history", "tunnel-lifecycle", "tunnel-runtime"]
tunnel-fsm = ["dep:vpnte-core", "dep:vpnte-profiles"]
tunnel-history = ["dep:vpnte-core"]
tunnel-lifecycle = ["tunnel-fsm", "tunnel-history", "dep:vpnte-core", "dep:vpnte-profiles"]
tunnel-runtime = ["tunnel-fsm", "dep:vpnte-core", "dep:vpnte-winnet", "dep:vpnte-profiles", "dep:vpnte-engine"]

[lints]
workspace = true
