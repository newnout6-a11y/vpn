[package]
name = "vpnte-update"
description = "Update channel: the signed feed (app, engines, helper service), its verification, the downloader, the engine store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util.workspace = true
hex.workspace = true
jiff.workspace = true
fastrand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
vpnte-base.workspace = true
vpnte-core.workspace = true
windows.workspace = true
# Verification only (Ed25519 over BLAKE2b-512, minisign format); no signing code in the app.
minisign-verify = "0.3.0"
# Engine archives (same version and features as vpnte-forensics: nothing new in the tree).
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
# Signs the test feeds with throw-away keys (the app itself only verifies).
minisign = "0.10.0"
# The loopback test server's request log.
parking_lot.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
