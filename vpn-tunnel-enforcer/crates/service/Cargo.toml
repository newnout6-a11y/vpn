[package]
name = "vpnte-service"
description = "Helper service: runs the privileged half of the tunnel (TUN, engines, WFP) as LocalSystem behind a named pipe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
hex.workspace = true
ipnet.workspace = true
parking_lot.workspace = true
regex.workspace = true
# Ed25519 for the signed self-update: already in the workspace through rustls' ring provider.
ring = { version = "0.17", default-features = false }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vpnte-base.workspace = true
vpnte-engine.workspace = true
# The leak self-test the service runs while the kill switch holds a session (p-svc-recheck).
vpnte-probes.workspace = true
vpnte-profiles.workspace = true
vpnte-tunnel.workspace = true
vpnte-winnet.workspace = true
windows = { workspace = true, features = ["Win32_System_Services"] }

[lints]
workspace = true
