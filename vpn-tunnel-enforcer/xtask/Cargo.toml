[package]
name = "xtask"
description = "Build automation for VPN Tunnel Enforcer: pinned engines, staging, packaging."
version = "0.0.0"
edition = "2024"
publish = false

# Standalone on purpose: build tooling stays out of the product's dependency graph.
[workspace]

[dependencies]
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
