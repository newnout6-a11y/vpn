[package]
name = "xtask"
description = "Build automation for VPN Tunnel Enforcer: pinned engines, staging, packaging."
version = "0.0.0"
edition = "2024"
publish = false

# Standalone on purpose: build tooling stays out of the product's dependency graph.
[workspace]

[dependencies]
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
# `cargo xtask feed`: signs the update feed (prehashed Ed25519, minisign format).
minisign = "0.10.0"

[target.'cfg(windows)'.dependencies]
# smoke-install reads the installer's registry values back (UTF-16, so the em dash in Comments round-trips).
windows-registry = "0.6"
