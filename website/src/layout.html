<!doctype html>
<html lang="ru" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="#efebe2">
{{canonical}}
<link rel="icon" href="{{base}}favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="VPN Tunnel Enforcer">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:locale" content="ru_RU">
<meta property="og:image" content="{{ogImage}}">
{{ogUrl}}
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="{{base}}assets/fonts/unbounded-cyrillic-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{base}}assets/fonts/golos-text-cyrillic-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{base}}css/site.css">
<script>
/* Класс js прячет контент до анимации появления. Если site.js не загрузился или упал,
   через 3 с включается js-fail и всё показывается без анимаций. vt-in — входящая арка перехода. */
(function(d){var h=d.documentElement;h.className='js';
try{if(sessionStorage.getItem('vt')){sessionStorage.removeItem('vt');h.className+=' vt-in'}}catch(e){}
setTimeout(function(){if(!window.__siteReady)h.className+=' js-fail'},3000)})(document)
</script>
</head>
<body class="{{bodyClass}}" data-base="{{base}}">
<a class="skip" href="#main">К содержимому</a>
<div class="progress" aria-hidden="true"></div>

<div class="noise" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>
{{> header}}
<main id="main">
{{content}}
</main>
{{> footer}}
<script src="{{base}}vendor/gsap.min.js" defer></script>
<script src="{{base}}vendor/ScrollTrigger.min.js" defer></script>
<script src="{{base}}vendor/lenis.min.js" defer></script>
<script src="{{base}}js/world-data.js" defer></script>
<script src="{{base}}js/site.js" defer></script>
</body>
</html>
